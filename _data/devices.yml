# Devices shown in the "Hardware" table on the homepage (_pages/includes/interests.md).
#
# Fields
#   name      display name (required)
#   category  table row label; devices with the same category share one row
#   emoji     icon shown before the category (use the same emoji for every device in a category)
#   link      product/spec page (optional; omit for no link)
#   status    in-use | idle | retired   (only "in-use" is rendered)
#   location  optional, coarse only (e.g. "home office", "work office")
#   order     sort key; rows appear in order of their first device, devices within a row by order
#
# Add a device: append an entry with status: in-use and an order placed where it should appear.
# Retire a device: change status to idle or retired (keep the entry for history) — it disappears from the table.
# Do NOT add private details here (serial numbers, prices, purchase dates, exact addresses).

